[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]
fs_permissions = [
    { access = "read-write", path = "./deployments" }
]

[etherscan]
avalanche_fuji = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=43113" }

[doc]
out = "docs"
title = "Abitus Contracts"
repository = "https://github.com/AbitusLabs/contracts"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
